name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish or retry
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Validate version tag
        id: version
        run: |
          version=$(sed -n '0,/<version>/{s:.*<version>\([^<]*\)</version>.*:\1:p}' pom.xml)
          test "$RELEASE_TAG" = "v$version"
          git rev-parse --verify "refs/tags/$RELEASE_TAG"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: mvn -B clean verify

      - name: Prepare release files and notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          artifact_name="TickScope-$VERSION.jar"
          artifact="target/$artifact_name"
          test -f "$artifact"
          (cd target && sha256sum "$artifact_name") > "$artifact.sha256"

          previous=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [[ "$previous" == "$RELEASE_TAG" ]]; then
            previous=""
          fi
          bash .github/scripts/release-notes.sh "$VERSION" "$previous" > "$RUNNER_TEMP/release-notes.md"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          artifact="target/TickScope-$VERSION.jar"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$artifact" "$artifact.sha256" --clobber
          else
            gh release create "$RELEASE_TAG" "$artifact" "$artifact.sha256" \
              --verify-tag --title "TickScope $RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

      - name: Publish Modrinth release
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/publish-modrinth.sh "$VERSION" "target/TickScope-$VERSION.jar" "$RUNNER_TEMP/release-notes.md"
