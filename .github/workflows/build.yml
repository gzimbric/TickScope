name: build

on:
  push:
    branches: [main, dev, nextgen]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ["17", "21", "25"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - run: mvn -B clean package

      - uses: actions/upload-artifact@v7
        if: matrix.java == '17'
        with:
          name: TickScope
          path: target/TickScope-*.jar
          if-no-files-found: error

  paper-26-3-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: temurin
          cache: maven
      # The newest stable build at the time of writing, from
      # https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api/maven-metadata.xml.
      # Dependabot cannot bump a workflow literal, so this is part of the pre-tag checklist.
      - name: Compile and test against Paper 26.3 API
        run: mvn -B -Dpaper.version=26.3.build.238-stable clean verify

  monitoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate dashboard JSON and documentation links
        run: |
          python3 -m json.tool assets/grafana/tickscope-dashboard.json > /dev/null
          python3 -m json.tool assets/grafana/tickscope-per-server-dashboard.json > /dev/null
          python3 .github/scripts/check-markdown-links.py README.md docs
          # The Modrinth page is README.md with its links rewritten; a link the rewrite
          # cannot handle must fail here, not on the project page after a release.
          bash .github/scripts/modrinth-body.sh README.md > /dev/null
      - name: Validate alert rules and behavior
        env:
          PROMETHEUS_VERSION: 3.14.0
        run: |
          archive="prometheus-$PROMETHEUS_VERSION.linux-amd64"
          curl --fail --location --retry 3 \
            "https://github.com/prometheus/prometheus/releases/download/v$PROMETHEUS_VERSION/$archive.tar.gz" \
            -o "$RUNNER_TEMP/prometheus.tar.gz"
          tar -xzf "$RUNNER_TEMP/prometheus.tar.gz" -C "$RUNNER_TEMP" --strip-components=1 "$archive/promtool"
          "$RUNNER_TEMP/promtool" check rules assets/prometheus/tickscope-alerts.yml
          "$RUNNER_TEMP/promtool" test rules assets/prometheus/tickscope-alerts.test.yml
