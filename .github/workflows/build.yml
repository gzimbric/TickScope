name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ["17", "21", "25"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - run: mvn -B clean package

      - uses: actions/upload-artifact@v4
        if: matrix.java == '17'
        with:
          name: TickScope
          path: target/TickScope-*.jar
          if-no-files-found: error
