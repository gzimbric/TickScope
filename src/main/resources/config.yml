# TickScope — Prometheus exporter for Paper. No runtime dependencies.

# Value of the `server` label on every metric. Keep this equal to the Loki `host`
# label so metrics and logs line up when correlating in Grafana.
server-id: "mcbox"

# IMPORTANT when running in Docker: bind 0.0.0.0 here, NOT 127.0.0.1.
# Docker's port publishing connects to the container's IP, not its loopback, so
# binding to 127.0.0.1 inside the container makes the port unreachable even with
# a -p mapping. Keep the exposure limit on the publish side instead, e.g.
#   ports: ["127.0.0.1:9101:9101"]
# which is what actually restricts this to the host's loopback.
bind-address: "0.0.0.0"
port: 9101
path: "/metrics"

# How often to sample on the main thread. 100 ticks = 5s.
# Every reading here is O(1) — Paper keeps entity/chunk/tile counts as counters — so
# this is cheap, but sampling faster than Prometheus scrapes buys nothing.
collection-interval-ticks: 100

# Per-world entity / tile-entity / chunk / player series.
per-world: true

entity-types:
  # Entities broken down by type, e.g. mc_world_entities_by_type{type="zombie"}.
  # This is the ONLY reading that iterates entities rather than reading a counter,
  # so it runs on its own slower cadence. Turn it off if entity counts get extreme.
  enabled: true
  interval-ticks: 600
