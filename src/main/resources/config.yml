# TickScope — Prometheus exporter for Paper and Folia. No runtime dependencies.

# Value of the `server` label on every metric. Keep this equal to the Loki `host`
# label so metrics and logs line up when correlating in Grafana.
server-id: "paper"

# Loopback is the safe default: a fresh install is not reachable from the LAN.
# IMPORTANT when running in Docker: change this to 0.0.0.0, NOT 127.0.0.1.
# Docker's port publishing connects to the container's IP, not its loopback, so
# binding to 127.0.0.1 inside the container makes the port unreachable even with
# a -p mapping. Keep the exposure limit on the publish side instead, e.g.
#   ports: ["127.0.0.1:9101:9101"]
# which is what actually restricts this to the host's loopback.
bind-address: "127.0.0.1"
port: 9101
# Absolute, no trailing slash, query or fragment. Must not start with "//" or contain "%".
path: "/metrics"

# Require `Authorization: Bearer <token>` on every scrape. Empty means no auth, which is
# fine when the endpoint is on loopback or behind a firewall. Set it when the scrape has to
# cross a network you do not fully control: the metrics say when nobody is online and which
# world holds your entities, which is more than you may want a stranger to be able to poll.
# In Prometheus this is `authorization: { credentials: <token> }` on the scrape job.
# NOTE this is plain HTTP -- the token is not encrypted in transit. It prevents anonymous
# reads; for confidentiality put a TLS-terminating reverse proxy in front.
auth-token: ""

# Further tokens accepted alongside auth-token, so a token can be rotated without a scrape
# failing in between: add the new token here, reload, switch the scraper to it, then remove
# the old one and reload again. Up to 8 tokens in total. Changing tokens never restarts the
# listener, so a scrape in flight is not cut off.
auth-tokens: []

# Connections served at the same time per client address; further ones are closed without
# a response. Two covers one scraper plus an operator's curl. Raise it when several scrapers
# reach TickScope through one reverse proxy or NAT, which makes them share an address.
# Range 1 to 12; the top of the range lets one address occupy every worker.
max-connections-per-address: 2

# How often to sample on Paper's main thread or Folia's global region. 100 ticks = 5s.
# Entity and tile-entity walks run separately on the slower scan cadence below.
# Sampling faster than Prometheus scrapes usually buys nothing. Minimum 20; a lower value
# is raised to 20 with a warning in the log.
collection-interval-ticks: 100

# Per-world entity / tile-entity / chunk / player series.
per-world: true

# Readings that have to walk the world rather than read a counter run on this slower
# cadence: per-world entity totals, per-world tile-entity totals, and the entity-type
# breakdown. Paper's tile-entity count iterates every loaded chunk, and before Minecraft
# 26 its entity count iterated every entity, so none of these are the O(1) counters that
# `per-world` above relies on -- which is why they are sampled here instead.
# All of them are unavailable on Folia, where walking a world crosses region ownership.
entity-types:
  # The per-type breakdown, e.g. mc_world_entities_by_type{type="zombie"}. Turning this
  # off keeps the cheaper per-world totals; interval-ticks still governs both.
  enabled: true
  # Idle ticks between the end of one world scan and the start of the next. The scan
  # itself takes about one tick per chunks-per-tick loaded chunks, so the time between two
  # samples is this plus the scan. Minimum 100; a lower value is raised to 100 with a
  # warning in the log.
  interval-ticks: 600
  # Maximum loaded chunks inspected on one Paper tick, 1 to 1000. A scan may span many
  # ticks; the last complete sample stays published until the next one finishes.
  chunks-per-tick: 32
  # Optional registry names to export, e.g. [zombie, chicken]. Empty means all types.
  # Names are matched as lowercase registry keys without a namespace, so `Zombie` and
  # `minecraft:zombie` both mean `zombie`.
  # Filters the breakdown only; per-world entity totals still include every entity.
  # This reduces exported series, but the included world's entities are still walked.
  allowlist: []

# Exact, case-sensitive world names omitted from all per-world metrics and slow scans.
# Server-wide players, event counters, and Folia player-location samples remain global.
exclude-worlds: []
