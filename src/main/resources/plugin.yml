name: TickScope
version: ${project.version}
main: cc.zimbri.tickscope.TickScope
api-version: "26.2"
load: POSTWORLD
description: Prometheus metrics exporter for Paper - TPS, MSPT, entities, chunks, JVM. No runtime dependencies.
author: Gabe Zimbric
commands:
  tickscope:
    description: Show TickScope status or reload its config
    aliases: [ts]
    usage: /tickscope <status|reload>
    permission: tickscope.admin
permissions:
  tickscope.admin:
    description: Use /tickscope
    default: op
