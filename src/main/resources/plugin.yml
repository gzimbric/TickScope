name: TickScope
version: ${project.version}
main: cc.zimbri.tickscope.TickScope
api-version: "1.18"
load: POSTWORLD
description: Prometheus metrics exporter for Paper and Folia. No runtime dependencies.
author: Gabe Zimbric
folia-supported: true
commands:
  tickscope:
    description: Show TickScope status or reload its config
    aliases: [ts]
    usage: /tickscope <status|reload>
    permission: tickscope.admin
permissions:
  tickscope.admin:
    description: Use /tickscope
    default: op
